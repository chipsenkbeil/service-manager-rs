[package]
name = "service-manager"
description = "Provides adapters to communicate with various operating system service managers"
categories = ["config"]
keywords = ["generator"]
version = "0.11.0"
authors = ["Chip Senkbeil <chip@senkbeil.org>"]
edition = "2021"
homepage = "https://github.com/chipsenkbeil/service-manager-rs"
repository = "https://github.com/chipsenkbeil/service-manager-rs"
readme = "README.md"
license = "MIT OR Apache-2.0"
rust-version = "1.75.0"

[features]
default = ["encoding"]
encoding = [
    "dep:encoding_rs",
    "dep:encoding-utils",
] # probe OsStr encoding while parsing

[workspace]
members = ["system-tests"]

[dependencies]
cfg-if = "1.0"
clap = { version = "4", features = ["derive"], optional = true }
dirs = "4.0"
log = "0.4"
plist = { version = "1.1", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
which = "8"
xml-rs = "0.8.19"

# Elsewhere command output is UTF-8, which std decodes.
[target.'cfg(windows)'.dependencies]
encoding_rs = { version = "0.8", optional = true }
encoding-utils = { version = "0.1", optional = true }

[dev-dependencies]
assert_fs = "1.0.13"
indoc = "2.0.4"
predicates = "3.0.4"

[lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
